<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyCity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="curtainGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="400" fill="url(#skyCity)"/>

  <!-- High-End Glass Curtain Wall Architecture in Perspective -->
  <polygon points="50,400 50,40 550,80 550,400" fill="url(#curtainGlass)" stroke="#0f172a" stroke-width="4"/>

  <!-- Vertical Aluminum Structural Mullions -->
  <line x1="150" y1="48" x2="150" y2="400" stroke="#0f172a" stroke-width="6"/>
  <line x1="250" y1="56" x2="250" y2="400" stroke="#0f172a" stroke-width="6"/>
  <line x1="350" y1="64" x2="350" y2="400" stroke="#0f172a" stroke-width="6"/>
  <line x1="450" y1="72" x2="450" y2="400" stroke="#0f172a" stroke-width="6"/>

  <!-- Horizontal Floor Bands / Spandrel Glass -->
  <line x1="50" y1="120" x2="550" y2="150" stroke="#0f172a" stroke-width="8"/>
  <line x1="50" y1="200" x2="550" y2="230" stroke="#0f172a" stroke-width="8"/>
  <line x1="50" y1="280" x2="550" y2="310" stroke="#0f172a" stroke-width="8"/>
  <line x1="50" y1="360" x2="550" y2="390" stroke="#0f172a" stroke-width="8"/>

  <!-- Dynamic Cloud Reflection across Facade -->
  <path d="M50,160 Q200,80 350,180 T550,140 L550,220 Q400,260 250,180 T50,240 Z" fill="#ffffff" opacity="0.25"/>
</svg>
