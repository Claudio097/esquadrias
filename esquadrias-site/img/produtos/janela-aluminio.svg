<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wallWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="frameWhiteAlu" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="skyGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="reflectionDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#wallWhite)"/>
  
  <!-- Outer Window Frame in White Aluminum -->
  <rect x="70" y="40" width="460" height="320" rx="4" fill="url(#frameWhiteAlu)" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="85" y="55" width="430" height="290" fill="#0f172a" opacity="0.1"/>

  <!-- Left Sash -->
  <rect x="90" y="60" width="205" height="280" rx="3" fill="url(#frameWhiteAlu)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="105" y="75" width="175" height="250" fill="url(#skyGlass)"/>
  <polygon points="105,75 220,75 140,325 105,325" fill="url(#reflectionDiag)"/>
  <!-- Latch -->
  <rect x="270" y="180" width="12" height="40" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>

  <!-- Right Sash -->
  <rect x="290" y="60" width="220" height="280" rx="3" fill="url(#frameWhiteAlu)" stroke="#cbd5e1" stroke-width="3" filter="drop-shadow(3px 0 6px rgba(0,0,0,0.1))"/>
  <rect x="305" y="75" width="190" height="250" fill="url(#skyGlass)"/>
  <polygon points="305,75 420,75 340,325 305,325" fill="url(#reflectionDiag)"/>
  <!-- Handle Latch -->
  <rect x="475" y="180" width="12" height="40" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>

  <!-- Granito Sill Bottom -->
  <rect x="50" y="355" width="500" height="20" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
</svg>
