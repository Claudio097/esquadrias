<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="frameAlumC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glassTintC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGradC)"/>
  
  <!-- Outer Alveolar Frame -->
  <rect x="40" y="50" width="520" height="300" rx="4" fill="url(#frameAlumC)" stroke="#475569" stroke-width="2"/>
  <rect x="52" y="62" width="496" height="276" fill="#0f172a"/>
  
  <!-- 4-Pane sliding panels (2 fixed outer, 2 central sliding) -->
  <!-- Pane 1 (Left fixed) -->
  <rect x="58" y="68" width="118" height="264" rx="2" fill="url(#frameAlumC)" stroke="#64748b" stroke-width="1.5"/>
  <rect x="68" y="78" width="98" height="244" fill="url(#glassTintC)"/>
  
  <!-- Pane 2 (Left sliding) -->
  <rect x="180" y="68" width="118" height="264" rx="2" fill="url(#frameAlumC)" stroke="#94a3b8" stroke-width="2"/>
  <rect x="190" y="78" width="98" height="244" fill="url(#glassTintC)"/>
  <rect x="288" y="180" width="6" height="40" rx="2" fill="#cbd5e1"/>
  
  <!-- Pane 3 (Right sliding) -->
  <rect x="302" y="68" width="118" height="264" rx="2" fill="url(#frameAlumC)" stroke="#94a3b8" stroke-width="2"/>
  <rect x="312" y="78" width="98" height="244" fill="url(#glassTintC)"/>
  <rect x="306" y="180" width="6" height="40" rx="2" fill="#cbd5e1"/>
  
  <!-- Pane 4 (Right fixed) -->
  <rect x="424" y="68" width="118" height="264" rx="2" fill="url(#frameAlumC)" stroke="#64748b" stroke-width="1.5"/>
  <rect x="434" y="78" width="98" height="244" fill="url(#glassTintC)"/>
  
  <!-- Bottom Rail -->
  <rect x="52" y="328" width="496" height="10" fill="#475569"/>
  
  <!-- Spec Label -->
  <rect x="220" y="348" width="160" height="20" rx="4" fill="#0f172a" fill-opacity="0.85"/>
  <text x="300" y="362" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4 FOLHAS / ALTO PADRÃO</text>
</svg>
