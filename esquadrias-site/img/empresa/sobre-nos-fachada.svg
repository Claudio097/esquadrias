<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightBuilding" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="40%" stop-color="#0d254c"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="facadePanel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="officeGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#1d4ed8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#twilightBuilding)"/>

  <!-- Modern Industrial / Corporate Headquarters Architecture -->
  <polygon points="50,400 50,140 280,90 560,110 560,400" fill="url(#facadePanel)" stroke="#334155" stroke-width="2"/>

  <!-- High-end Aluminum Curtain Wall (Pele de Vidro) -->
  <rect x="90" y="150" width="220" height="230" fill="url(#officeGlass)" stroke="#0f172a" stroke-width="6"/>
  <!-- Aluminum Vertical Mullions -->
  <line x1="145" y1="150" x2="145" y2="380" stroke="#0f172a" stroke-width="4"/>
  <line x1="200" y1="150" x2="200" y2="380" stroke="#0f172a" stroke-width="4"/>
  <line x1="255" y1="150" x2="255" y2="380" stroke="#0f172a" stroke-width="4"/>
  <!-- Horizontal Transoms -->
  <line x1="90" y1="210" x2="310" y2="210" stroke="#0f172a" stroke-width="4"/>
  <line x1="90" y1="270" x2="310" y2="270" stroke="#0f172a" stroke-width="4"/>
  <line x1="90" y1="330" x2="310" y2="330" stroke="#0f172a" stroke-width="4"/>

  <!-- Right Section: Automated Sectional Door / Showroom Glass Bay -->
  <rect x="340" y="170" width="180" height="210" fill="#020617" stroke="#334155" stroke-width="4"/>
  <rect x="350" y="180" width="160" height="40" fill="url(#officeGlass)"/>
  <rect x="350" y="230" width="160" height="40" fill="url(#officeGlass)"/>
  <rect x="350" y="280" width="160" height="40" fill="url(#officeGlass)"/>
  <rect x="350" y="330" width="160" height="40" fill="url(#officeGlass)"/>

  <!-- Exterior Architectural Downlights -->
  <circle cx="200" cy="130" r="4" fill="#60a5fa"/>
  <circle cx="430" cy="150" r="4" fill="#60a5fa"/>
  <polygon points="195,135 160,250 240,250 205,135" fill="#60a5fa" opacity="0.1"/>
  <polygon points="425,155 380,260 480,260 435,155" fill="#60a5fa" opacity="0.1"/>

  <!-- Dark Gradient Overlay on left for text legibility -->
  <rect width="400" height="400" fill="url(#twilightBuilding)" opacity="0.85"/>
</svg>
