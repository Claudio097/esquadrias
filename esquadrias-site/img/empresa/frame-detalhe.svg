<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blackProfileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="glazingReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="350" height="500" fill="#020617"/>

  <!-- Dramatic Macro Shot of Corner Window Frame with Gasket -->
  <!-- Glass Pane Behind -->
  <rect x="140" y="0" width="210" height="340" fill="url(#glazingReflection)"/>
  
  <!-- Massive Black Aluminum Frame (Gold / Suprema series style) -->
  <polygon points="40,0 140,0 140,340 350,340 350,440 40,440" fill="url(#blackProfileGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Architectural Chamfer / Bevel -->
  <polygon points="40,0 60,20 60,420 40,440" fill="#334155" opacity="0.6"/>
  <polygon points="40,440 60,420 330,420 350,440" fill="#0f172a"/>

  <!-- High Precision EPDM Rubber Gasket (Borracha de Vedação) -->
  <rect x="132" y="0" width="8" height="340" fill="#000000"/>
  <rect x="140" y="332" width="210" height="8" fill="#000000"/>
  
  <!-- Subtle Glazing Glare -->
  <line x1="160" y1="20" x2="330" y2="190" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="180" y1="20" x2="350" y2="190" stroke="#ffffff" stroke-width="0.75" opacity="0.4"/>
</svg>
