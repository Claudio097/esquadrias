<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="extrusionShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="cutEnd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="500" height="350" fill="#0b1329"/>

  <!-- Stacked Extruded Aluminum Profiles Bundle in Perspective -->
  <!-- Profile 1 -->
  <polygon points="120,40 450,20 450,110 120,130" fill="url(#extrusionShine)" stroke="#1e293b"/>
  <polygon points="30,80 120,40 120,130 30,170" fill="url(#cutEnd)" stroke="#0f172a" stroke-width="2"/>
  <rect x="50" y="95" width="40" height="40" rx="3" fill="#0b1329"/>

  <!-- Profile 2 -->
  <polygon points="210,130 520,110 520,200 210,220" fill="url(#extrusionShine)" stroke="#1e293b"/>
  <polygon points="120,170 210,130 210,220 120,260" fill="url(#cutEnd)" stroke="#0f172a" stroke-width="2"/>
  <rect x="140" y="185" width="40" height="40" rx="3" fill="#0b1329"/>

  <!-- Profile 3 -->
  <polygon points="80,180 390,160 390,250 80,270" fill="url(#extrusionShine)" stroke="#1e293b"/>
  <polygon points="0,220 80,180 80,270 0,310" fill="url(#cutEnd)" stroke="#0f172a" stroke-width="2"/>
  <rect x="20" y="235" width="35" height="40" rx="3" fill="#0b1329"/>

  <!-- Profile 4 -->
  <polygon points="280,210 550,190 550,280 280,300" fill="url(#extrusionShine)" stroke="#1e293b"/>
  <polygon points="190,250 280,210 280,300 190,340" fill="url(#cutEnd)" stroke="#0f172a" stroke-width="2"/>
  <rect x="210" y="265" width="40" height="40" rx="3" fill="#0b1329"/>

  <!-- Dramatic Dark Vignette for White Text Overlays -->
  <rect width="500" height="350" fill="#020617" opacity="0.6"/>
</svg>
