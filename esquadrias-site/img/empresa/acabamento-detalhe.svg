<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="silverAnodized1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="silverAnodized2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#darkBg)"/>

  <!-- 45 Degree Miter Joint (Corte em Esquadria 45 Graus) -->
  <!-- Top Horizontal Profile Member -->
  <polygon points="50,40 350,40 270,120 50,120" fill="url(#silverAnodized1)" stroke="#334155" stroke-width="1.5"/>
  <polygon points="50,40 50,60 250,60 270,40" fill="#e2e8f0" opacity="0.6"/>

  <!-- Vertical Profile Member -->
  <polygon points="270,120 350,40 350,280 270,280" fill="url(#silverAnodized2)" stroke="#334155" stroke-width="1.5"/>
  <polygon points="350,40 330,60 330,280 350,280" fill="#64748b" opacity="0.4"/>

  <!-- Precision Hairline Miter Seam (Corte de Precisão 45º) -->
  <line x1="270" y1="120" x2="350" y2="40" stroke="#0f172a" stroke-width="2"/>
  <line x1="270" y1="120" x2="350" y2="40" stroke="#ffffff" stroke-width="0.75" opacity="0.8"/>

  <!-- Glass Inset Area inside frame -->
  <polygon points="50,120 270,120 270,280 50,280" fill="#0284c7" opacity="0.15"/>
  <line x1="50" y1="120" x2="270" y2="120" stroke="#000" stroke-width="3"/>
  <line x1="270" y1="120" x2="270" y2="280" stroke="#000" stroke-width="3"/>
  <text x="70" y="200" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" opacity="0.4">VIDRO LAMINADO</text>
</svg>
