<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#eqGrad)"/>
  
  <!-- Team Representation: Engineer & Technicians with Blueprints & Hardhats -->
  <!-- Person 1 (Project Engineer) -->
  <circle cx="210" cy="140" r="32" fill="#cbd5e1"/>
  <!-- Safety Helmet -->
  <path d="M 175 140 Q 210 100 245 140 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="170" y="138" width="80" height="6" rx="2" fill="#ffffff"/>
  <path d="M 160 270 Q 210 200 260 270" fill="#1e3a8a"/>
  
  <!-- Person 2 (Lead Technician / Master Fabricator) -->
  <circle cx="300" cy="130" r="35" fill="#cbd5e1"/>
  <!-- Safety Helmet -->
  <path d="M 260 130 Q 300 85 340 130 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <rect x="255" y="128" width="90" height="6" rx="2" fill="#f59e0b"/>
  <path d="M 240 270 Q 300 190 360 270" fill="#0284c7"/>
  
  <!-- Person 3 (Installation Specialist) -->
  <circle cx="390" cy="140" r="32" fill="#cbd5e1"/>
  <!-- Safety Helmet -->
  <path d="M 355 140 Q 390 100 425 140 Z" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <rect x="350" y="138" width="80" height="6" rx="2" fill="#3b82f6"/>
  <path d="M 340 270 Q 390 200 440 270" fill="#1e3a8a"/>

  <!-- Blueprint Scroll on Foreground Desk -->
  <rect x="120" y="270" width="360" height="50" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
  <line x1="150" y1="285" x2="350" y2="285" stroke="#ffffff" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="150" y1="300" x2="420" y2="300" stroke="#ffffff" stroke-width="2" stroke-dasharray="12,6"/>

  <rect x="40" y="345" width="520" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="300" y="365" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">EQUIPE TÉCNICA ESPECIALIZADA EM ENGENHARIA DE ESQUADRIAS</text>
</svg>
