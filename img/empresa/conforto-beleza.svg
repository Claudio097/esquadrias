<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="warmRoom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>

    <linearGradient id="lushGarden" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <linearGradient id="glassCorner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Outside Lush Garden View -->
  <rect width="500" height="350" fill="url(#lushGarden)"/>
  <!-- Trees and sunlight foliage outside -->
  <circle cx="100" cy="120" r="100" fill="#4ade80" opacity="0.6"/>
  <circle cx="280" cy="90" r="110" fill="#86efac" opacity="0.5"/>
  <circle cx="420" cy="140" r="120" fill="#15803d" opacity="0.7"/>

  <!-- Interior Floor / Wall Foreground -->
  <polygon points="0,240 180,240 220,350 0,350" fill="#78350f"/> <!-- Hardwood floor -->
  <polygon points="0,0 70,0 70,350 0,350" fill="#1c1917"/> <!-- Left wall -->
  <polygon points="0,0 500,0 500,40 0,40" fill="#292524"/> <!-- Ceiling beam -->

  <!-- Modern Corner Aluminum Glass Window Frame -->
  <rect x="70" y="40" width="430" height="200" fill="url(#glassCorner)"/>
  
  <!-- Sleek Matte Black Mullions -->
  <line x1="70" y1="40" x2="500" y2="40" stroke="#090d16" stroke-width="8"/>
  <line x1="70" y1="240" x2="500" y2="240" stroke="#090d16" stroke-width="12"/>
  <line x1="220" y1="40" x2="220" y2="240" stroke="#090d16" stroke-width="8"/>
  <line x1="380" y1="40" x2="380" y2="240" stroke="#090d16" stroke-width="8"/>

  <!-- Interior Modern Lounge Chair -->
  <ellipse cx="140" cy="270" rx="45" ry="18" fill="#d97706" opacity="0.8"/>
  <rect x="110" y="220" width="60" height="50" rx="8" fill="#b45309"/>

  <!-- Dark Gradient at bottom for text readability -->
  <rect x="0" y="160" width="500" height="190" fill="url(#warmRoom)" opacity="0.85"/>
</svg>
