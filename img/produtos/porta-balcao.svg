<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="warmDining" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="balconyGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Outside Balcony Deck / Garden Background -->
  <rect width="600" height="400" fill="#14532d"/>
  <rect y="220" width="600" height="180" fill="#292524"/> <!-- Outdoor decking -->

  <!-- Interior Dining Set visible through glass -->
  <ellipse cx="300" cy="270" rx="90" ry="25" fill="#451a03"/>
  <rect x="230" y="220" width="30" height="60" rx="4" fill="#78350f"/>
  <rect x="340" y="220" width="30" height="60" rx="4" fill="#78350f"/>

  <!-- 4-Leaf Black Aluminum Balcony Door System (Porta Balcão) -->
  <rect x="40" y="30" width="520" height="340" fill="none" stroke="#0b0f19" stroke-width="12"/>

  <!-- Leaf 1 -->
  <rect x="46" y="36" width="130" height="328" fill="url(#balconyGlass)" stroke="#1e293b" stroke-width="8"/>
  <line x1="168" y1="160" x2="168" y2="240" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Leaf 2 -->
  <rect x="172" y="36" width="130" height="328" fill="url(#balconyGlass)" stroke="#1e293b" stroke-width="8"/>
  <line x1="294" y1="160" x2="294" y2="240" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Leaf 3 -->
  <rect x="298" y="36" width="130" height="328" fill="url(#balconyGlass)" stroke="#1e293b" stroke-width="8"/>
  <line x1="306" y1="160" x2="306" y2="240" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Leaf 4 -->
  <rect x="424" y="36" width="130" height="328" fill="url(#balconyGlass)" stroke="#1e293b" stroke-width="8"/>
  <line x1="432" y1="160" x2="432" y2="240" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Flush Inox Handles -->
  <rect x="295" y="180" width="10" height="40" rx="3" fill="#ffffff"/>
</svg>
