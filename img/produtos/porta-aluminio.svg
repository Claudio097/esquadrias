<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="entryWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="blackPivotDoor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="inoxBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Entryway Porch Wall -->
  <rect width="600" height="400" fill="url(#entryWall)"/>
  <!-- Stone Wall Siding -->
  <polygon points="0,0 140,0 140,400 0,400" fill="#94a3b8" opacity="0.6"/>
  <polygon points="460,0 600,0 600,400 460,400" fill="#94a3b8" opacity="0.6"/>

  <!-- Door Portal Recess -->
  <rect x="170" y="20" width="260" height="380" fill="#020617"/>

  <!-- Heavy Aluminum Pivot Door Leaf -->
  <rect x="180" y="30" width="240" height="370" fill="url(#blackPivotDoor)" stroke="#334155" stroke-width="2"/>
  
  <!-- Architectural Horizontal Recessed Grooves (Frisos) -->
  <line x1="185" y1="80" x2="415" y2="80" stroke="#000000" stroke-width="4"/>
  <line x1="185" y1="81" x2="415" y2="81" stroke="#475569" stroke-width="1.5"/>
  <line x1="185" y1="130" x2="415" y2="130" stroke="#000000" stroke-width="4"/>
  <line x1="185" y1="131" x2="415" y2="131" stroke="#475569" stroke-width="1.5"/>
  <line x1="185" y1="180" x2="415" y2="180" stroke="#000000" stroke-width="4"/>
  <line x1="185" y1="181" x2="415" y2="181" stroke="#475569" stroke-width="1.5"/>
  <line x1="185" y1="230" x2="415" y2="230" stroke="#000000" stroke-width="4"/>
  <line x1="185" y1="231" x2="415" y2="231" stroke="#475569" stroke-width="1.5"/>
  <line x1="185" y1="280" x2="415" y2="280" stroke="#000000" stroke-width="4"/>
  <line x1="185" y1="281" x2="415" y2="281" stroke="#475569" stroke-width="1.5"/>
  <line x1="185" y1="330" x2="415" y2="330" stroke="#000000" stroke-width="4"/>
  <line x1="185" y1="331" x2="415" y2="331" stroke="#475569" stroke-width="1.5"/>

  <!-- Elegant Stainless Steel Vertical Bar Pull Handle (Puxador Inox Barra Redonda) -->
  <rect x="385" y="90" width="12" height="220" rx="6" fill="url(#inoxBar)" stroke="#475569" stroke-width="1.5" filter="drop-shadow(3px 4px 6px rgba(0,0,0,0.6))"/>
  <rect x="383" y="115" width="16" height="8" rx="2" fill="#334155"/>
  <rect x="383" y="275" width="16" height="8" rx="2" fill="#334155"/>

  <!-- Potted Plant on Right (as in reference photo) -->
  <ellipse cx="500" cy="385" rx="35" ry="12" fill="#1e293b" opacity="0.3"/>
  <polygon points="480,385 520,385 515,310 485,310" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Tall Green Plant Stems & Leaves -->
  <ellipse cx="500" cy="280" rx="22" ry="35" fill="#15803d"/>
  <ellipse cx="485" cy="260" rx="18" ry="40" fill="#16a34a"/>
  <ellipse cx="515" cy="250" rx="18" ry="42" fill="#22c55e"/>
  <ellipse cx="500" cy="230" rx="16" ry="45" fill="#4ade80"/>
</svg>
